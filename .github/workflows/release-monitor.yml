name: GitHub Release Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests
          
      - name: Check GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " GitHub Release Monitor"
          echo "========================================"

          python <<'PY'
          import json
          import os
          import time
          import requests

          STATE_FILE = "state.json"

          REPOSITORIES = [
              "clash-verge-rev/clash-verge-rev",
              "OpenListTeam/OpenList",
              "RaiDrive/RaiDrive",
              "happycola233/tchMaterial-parser",
          ]

          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")
          NTFY_URL = os.environ.get("NTFY_URL", "").strip()
          NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          # ========================================
          # 读取状态
          # ========================================

          try:
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  state = json.load(f)

              if not isinstance(state, dict):
                  state = {}

          except Exception:
              state = {}

          # ========================================
          # GitHub API
          # ========================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-release-monitor"
          })

          if GITHUB_TOKEN:
              session.headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"

          # ========================================
          # ntfy
          # ========================================

          def send_ntfy(repo, version, release_name, published_at, release_url):

              if not NTFY_URL:
                  print("WARNING: NTFY_URL is not configured.")
                  return False

              if not NTFY_TOPIC:
                  print("WARNING: NTFY_TOPIC is not configured.")
                  return False

              notify_url = (
                  NTFY_URL.rstrip("/")
                  + "/"
                  + NTFY_TOPIC
              )

              title = "GitHub Release 更新"

              message = (
                  f"仓库：{repo}\n"
                  f"版本：{version}\n"
                  f"名称：{release_name}\n"
                  f"发布时间：{published_at}\n"
                  f"Release：{release_url}"
              )

              headers = {
                  "Title": title,
                  "Priority": "4",
                  "Tags": "github,new_release",
                  "Click": release_url,
              }

              print("")
              print("----------------------------------------")
              print("Sending ntfy notification")
              print(f"Repository : {repo}")
              print(f"Version    : {version}")
              print("----------------------------------------")

              try:
                  response = requests.post(
                      notify_url,
                      data=message.encode("utf-8"),
                      headers=headers,
                      timeout=30,
                  )

                  print(
                      "ntfy HTTP status: "
                      + str(response.status_code)
                  )

                  if 200 <= response.status_code < 300:
                      print("Notification sent successfully.")
                      return True

                  print("ERROR: ntfy notification failed.")
                  print(response.text)
                  return False

              except Exception as e:
                  print("ERROR: ntfy request failed.")
                  print(str(e))
                  return False

          # ========================================
          # 开始检查
          # ========================================

          state_changed = False

          for repo in REPOSITORIES:

              print("")
              print("----------------------------------------")
              print("Checking: " + repo)
              print("----------------------------------------")

              api_url = (
                  "https://api.github.com/repos/"
                  + repo
                  + "/releases/latest"
              )

              try:
                  response = session.get(
                      api_url,
                      timeout=30
                  )

              except Exception as e:
                  print("WARNING: GitHub API request failed")
                  print("Reason: " + str(e))
                  print("Skipping: " + repo)
                  continue

              # ====================================
              # API 错误
              # ====================================

              if response.status_code != 200:

                  print("WARNING: GitHub API request failed")
                  print(
                      "HTTP status: "
                      + str(response.status_code)
                  )

                  try:
                      error_data = response.json()
                      print(
                          "GitHub message: "
                          + str(
                              error_data.get(
                                  "message",
                                  "Unknown error"
                              )
                          )
                      )
                  except Exception:
                      pass

                  print("Skipping: " + repo)
                  continue

              # ====================================
              # 读取 Release
              # ====================================

              try:
                  release = response.json()
              except Exception as e:
                  print("WARNING: Invalid GitHub response")
                  print("Reason: " + str(e))
                  print("Skipping: " + repo)
                  continue

              tag_name = release.get("tag_name", "")
              release_name = (
                  release.get("name")
                  or tag_name
              )
              published_at = (
                  release.get("published_at", "")
              )
              release_url = (
                  release.get("html_url", "")
              )

              if not tag_name:
                  print("WARNING: No release found.")
                  print("Skipping: " + repo)
                  continue

              print("Latest release : " + tag_name)
              print("Release name   : " + release_name)
              print("Published      : " + published_at)

              previous_version = state.get(repo)

              # ====================================
              # 第一次检查
              # ====================================

              if previous_version is None:

                  print("Previous version: none")
                  print("First check for this repository.")
                  print(
                      "Recording current version "
                      "without notification."
                  )

                  state[repo] = tag_name
                  state_changed = True

                  continue

              print(
                  "Previous version: "
                  + str(previous_version)
              )

              # ====================================
              # 没有新版本
              # ====================================

              if previous_version == tag_name:

                  print("No new release.")
                  print("Skipping notification.")

                  continue

              # ====================================
              # 发现新版本
              # ====================================

              print("")
              print("****************************************")
              print(" NEW RELEASE DETECTED!")
              print("****************************************")
              print("Repository : " + repo)
              print("Previous   : " + str(previous_version))
              print("Latest     : " + tag_name)
              print("Name       : " + release_name)
              print("Published  : " + published_at)
              print("URL        : " + release_url)
              print("****************************************")

              send_ntfy(
                  repo,
                  tag_name,
                  release_name,
                  published_at,
                  release_url
              )

              # 更新状态，避免重复通知
              state[repo] = tag_name
              state_changed = True

              time.sleep(1)

          # ========================================
          # 保存 state.json
          # ========================================

          if state_changed:

              print("")
              print("Updating state.json...")

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write("\n")

              print("state.json updated.")

          else:

              print("")
              print("No state changes.")

          PY

      - name: Commit and push state
        run: |
          set -e

          echo "========================================"
          echo " Saving monitor state"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update release monitor state"

          echo "Fetching latest main..."

          git fetch origin main

          echo "Rebasing..."

          git rebase origin/main

          echo "Pushing..."

          git push origin HEAD:main

          echo "========================================"
          echo " State saved successfully"
          echo "========================================"

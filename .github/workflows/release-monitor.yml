name: GitHub Release Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub Releases
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          STATE_FILE="state.json"
          REPO_FILE="repositories.txt"

          echo "========================================"
          echo " GitHub Release Monitor"
          echo "========================================"

          # 检查 repositories.txt
          if [ ! -f "$REPO_FILE" ]; then
            echo "ERROR: repositories.txt not found"
            exit 1
          fi

          # 如果 state.json 不存在，自动创建
          if [ ! -f "$STATE_FILE" ]; then
            echo "{}" > "$STATE_FILE"
          fi

          # 检查 state.json 是否为有效 JSON
          if ! jq empty "$STATE_FILE" >/dev/null 2>&1; then
            echo "ERROR: state.json contains invalid JSON"
            exit 1
          fi

          # 检查 ntfy Topic
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "ERROR: NTFY_TOPIC secret is not configured"
            exit 1
          fi

          changed=false

          # ========================================
          # 遍历 repositories.txt
          # ========================================

          while IFS= read -r REPO || [ -n "$REPO" ]; do

            # 去除前后空格
            REPO="$(echo "$REPO" | xargs)"

            # 跳过空行
            [ -z "$REPO" ] && continue

            # 跳过注释
            [[ "$REPO" =~ ^# ]] && continue

            echo ""
            echo "----------------------------------------"
            echo "Checking: $REPO"
            echo "----------------------------------------"

            # ======================================
            # 获取最新 Release
            # ======================================

            RESPONSE=$(curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              2>/dev/null || true)

            # API 请求失败
            if [ -z "$RESPONSE" ]; then
              echo "WARNING: GitHub API request failed"
              echo "Skipping: $REPO"
              continue
            fi

            # ======================================
            # 获取 Release 信息
            # ======================================

            TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
            NAME=$(echo "$RESPONSE" | jq -r '.name // empty')
            URL=$(echo "$RESPONSE" | jq -r '.html_url // empty')
            PUBLISHED=$(echo "$RESPONSE" | jq -r '.published_at // empty')
            BODY=$(echo "$RESPONSE" | jq -r '.body // empty')

            # 没有 Release
            if [ -z "$TAG" ]; then
              echo "No release found"
              continue
            fi

            echo "Latest release : $TAG"
            echo "Release name   : $NAME"
            echo "Published      : $PUBLISHED"

            # ======================================
            # 获取历史版本
            # ======================================

            OLD_TAG=$(jq -r \
              --arg repo "$REPO" \
              '.[$repo] // empty' \
              "$STATE_FILE")

            if [ -z "$OLD_TAG" ]; then
              echo "Previous version: none"
            else
              echo "Previous version: $OLD_TAG"
            fi

            # ======================================
            # 第一次监控
            # ======================================

            if [ -z "$OLD_TAG" ]; then

              echo ""
              echo "First check for this repository."
              echo "Recording current version without notification."

              jq \
                --arg repo "$REPO" \
                --arg tag "$TAG" \
                '.[$repo] = $tag' \
                "$STATE_FILE" > state.tmp

              mv state.tmp "$STATE_FILE"

              changed=true

              continue
            fi

            # ======================================
            # 版本没有变化
            # ======================================

            if [ "$OLD_TAG" = "$TAG" ]; then

              echo "No update."

              continue
            fi

            # ======================================
            # 发现新版本
            # ======================================

            echo ""
            echo "========================================"
            echo " NEW RELEASE FOUND!"
            echo "========================================"
            echo "Repository : $REPO"
            echo "Old version: $OLD_TAG"
            echo "New version: $TAG"

            # ======================================
            # 限制 Release Notes 长度
            # ======================================

            if [ ${#BODY} -gt 2000 ]; then
              BODY="${BODY:0:2000}"$'\n\n... (Release notes truncated)'
            fi

            if [ -z "$BODY" ]; then
              BODY="(No release notes provided)"
            fi

            if [ -z "$PUBLISHED" ]; then
              PUBLISHED="Unknown"
            fi

            # ======================================
            # 创建通知内容
            # 使用 printf 避免 YAML 多行字符串问题
            # ======================================

            printf -v MESSAGE \
              '项目：%s\n\n旧版本：%s\n新版本：%s\n\n发布时间：%s\n\n更新说明：\n%s\n\n查看 Release：\n%s' \
              "$REPO" \
              "$OLD_TAG" \
              "$TAG" \
              "$PUBLISHED" \
              "$BODY" \
              "$URL"

            # ======================================
            # 发送 ntfy
            # ======================================

            echo ""
            echo "Sending ntfy notification..."

            curl \
              --fail \
              --retry 3 \
              --retry-delay 2 \
              -X POST \
              -H "Title: GitHub Release 更新" \
              -H "Priority: high" \
              -H "Tags: github,package" \
              -H "Click: $URL" \
              --data-binary "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"

            echo ""
            echo "ntfy notification sent successfully."

            # ======================================
            # 只有 ntfy 成功后才更新版本
            # ======================================

            jq \
              --arg repo "$REPO" \
              --arg tag "$TAG" \
              '.[$repo] = $tag' \
              "$STATE_FILE" > state.tmp

            mv state.tmp "$STATE_FILE"

            changed=true

          done < "$REPO_FILE"

          # ========================================
          # 保存 state.json
          # ========================================

          if [ "$changed" = true ]; then

            echo ""
            echo "Updating state.json..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$STATE_FILE"

            if ! git diff --cached --quiet; then

              git commit -m "Update release monitor state"

              git push

              echo "state.json updated successfully."

            else

              echo "No state changes to commit."

            fi

          else

            echo ""
            echo "No version changes detected."
          fi

          echo ""
          echo "========================================"
          echo " Release check completed"
          echo "========================================"

name: GitHub Release Monitor

on:
  schedule:
    # 每天北京时间 12:30
    # GitHub Actions 使用 UTC
    # 北京时间 UTC+8
    # 12:30 北京时间 = 04:30 UTC
    - cron: "30 4 * * *"

  # 保留手动运行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # Checkout
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ================================================================
      # Python
      # ================================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ================================================================
      # Install requests
      # ================================================================

      - name: Install dependencies
        run: python -m pip install requests


      # ================================================================
      # Check GitHub Releases
      # ================================================================

      - name: Check GitHub Releases

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          # ntfy Access Token
          NTFY_AUTH: ${{ secrets.NTFY_AUTH }}

        run: |

          set -euo pipefail

          python <<'PY'

          import json
          import os
          import time
          import requests


          # ============================================================
          # Configuration
          # ============================================================

          STATE_FILE = "state.json"


          # 要监测的 GitHub 仓库
          REPOSITORIES = [
              "clash-verge-rev/clash-verge-rev",
              "OpenListTeam/OpenList",
              "happycola233/tchMaterial-parser",
          ]


          # ============================================================
          # Environment variables
          # ============================================================

          GITHUB_TOKEN = os.environ.get(
              "GITHUB_TOKEN",
              ""
          ).strip()


          NTFY_URL = os.environ.get(
              "NTFY_URL",
              ""
          ).strip()


          NTFY_TOPIC = os.environ.get(
              "NTFY_TOPIC",
              ""
          ).strip()


          NTFY_AUTH = os.environ.get(
              "NTFY_AUTH",
              ""
          ).strip()


          # ============================================================
          # Header
          # ============================================================

          print("")
          print("========================================")
          print(" GitHub Release Monitor")
          print("========================================")

          print(
              "Repositories : "
              + str(len(REPOSITORIES))
          )

          print(
              "NTFY URL     : "
              + (
                  "configured"
                  if NTFY_URL
                  else "MISSING"
              )
          )

          print(
              "NTFY Topic   : "
              + (
                  "configured"
                  if NTFY_TOPIC
                  else "MISSING"
              )
          )

          print(
              "NTFY Auth    : "
              + (
                  "configured"
                  if NTFY_AUTH
                  else "MISSING"
              )
          )

          print("========================================")


          # ============================================================
          # Validate ntfy configuration
          # ============================================================

          if not NTFY_URL:

              print("")
              print("ERROR: NTFY_URL is not configured.")
              print("Please check GitHub Secrets.")
              exit(1)


          if not NTFY_TOPIC:

              print("")
              print("ERROR: NTFY_TOPIC is not configured.")
              print("Please check GitHub Secrets.")
              exit(1)


          if not NTFY_AUTH:

              print("")
              print("ERROR: NTFY_AUTH is not configured.")
              print("Please check GitHub Secrets.")
              exit(1)


          # ============================================================
          # Load state.json
          # ============================================================

          try:

              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  state = json.load(f)


              if not isinstance(state, dict):

                  print(
                      "WARNING: state.json is not a dictionary."
                  )

                  state = {}


          except Exception as e:

              print(
                  "WARNING: state.json could not be read."
              )

              print(
                  "Reason: "
                  + str(e)
              )

              print(
                  "Starting with empty state."
              )

              state = {}


          # ============================================================
          # GitHub API Session
          # ============================================================

          session = requests.Session()


          session.headers.update({

              "Accept":
                  "application/vnd.github+json",

              "X-GitHub-Api-Version":
                  "2022-11-28",

              "User-Agent":
                  "github-release-monitor"

          })


          if GITHUB_TOKEN:

              session.headers["Authorization"] = (
                  "Bearer "
                  + GITHUB_TOKEN
              )


          # ============================================================
          # Send ntfy notification
          # ============================================================

          def send_ntfy(
              repo,
              version,
              release_name,
              published_at,
              release_url
          ):

              # --------------------------------------------------------
              # ntfy URL
              # --------------------------------------------------------

              notify_url = (

                  NTFY_URL.rstrip("/")

                  + "/"

                  + NTFY_TOPIC

              )


              # --------------------------------------------------------
              # Message
              # --------------------------------------------------------

              message = (

                  f"仓库：{repo}\n"

                  f"版本：{version}\n"

                  f"名称：{release_name}\n"

                  f"发布时间：{published_at}\n"

                  f"Release：{release_url}"

              )


              # --------------------------------------------------------
              # Headers
              #
              # Authorization:
              #     使用 ntfy Access Token
              #
              # Email:
              #     yes = 使用当前 ntfy 账户的
              #     Primary / 已验证邮箱
              # --------------------------------------------------------

              headers = {

                  "Authorization":
                      "Bearer "
                      + NTFY_AUTH,

                  "Title":
                      "GitHub Release Update",

                  "Priority":
                      "4",

                  "Tags":
                      "github,new_release",

                  "Click":
                      release_url,

                  "Email":
                      "yes",

              }


              # --------------------------------------------------------
              # Log
              # --------------------------------------------------------

              print("")
              print("----------------------------------------")
              print("Sending ntfy notification")
              print("----------------------------------------")

              print(
                  "Repository : "
                  + repo
              )

              print(
                  "Version    : "
                  + version
              )

              print(
                  "Auth       : configured"
              )

              print(
                  "Email      : account email"
              )

              print("----------------------------------------")


              # --------------------------------------------------------
              # Send HTTP request
              # --------------------------------------------------------

              try:

                  response = requests.post(

                      notify_url,

                      data=message.encode(
                          "utf-8"
                      ),

                      headers=headers,

                      timeout=30,

                  )


                  print(
                      "ntfy HTTP status: "
                      + str(
                          response.status_code
                      )
                  )


                  # ----------------------------------------------------
                  # Success
                  # ----------------------------------------------------

                  if (
                      200
                      <= response.status_code
                      < 300
                  ):

                      print(
                          "Notification sent successfully."
                      )

                      print(
                          "Mobile notification: OK"
                      )

                      print(
                          "Email notification: requested"
                      )

                      return True


                  # ----------------------------------------------------
                  # Failed
                  # ----------------------------------------------------

                  print(
                      "ERROR: ntfy notification failed."
                  )

                  print(
                      "HTTP status: "
                      + str(
                          response.status_code
                      )
                  )

                  print(
                      "Response: "
                      + response.text
                  )

                  return False


              except Exception as e:

                  print(
                      "ERROR: ntfy request failed."
                  )

                  print(
                      "Reason: "
                      + str(e)
                  )

                  return False


          # ============================================================
          # Monitor repositories
          # ============================================================

          state_changed = False


          for repo in REPOSITORIES:

              print("")
              print("")
              print("========================================")

              print(
                  "Checking: "
                  + repo
              )

              print("========================================")


              # --------------------------------------------------------
              # GitHub API URL
              # --------------------------------------------------------

              api_url = (

                  "https://api.github.com/repos/"

                  + repo

                  + "/releases/latest"

              )


              # --------------------------------------------------------
              # Request GitHub
              # --------------------------------------------------------

              try:

                  response = session.get(

                      api_url,

                      timeout=30

                  )


              except Exception as e:

                  print(
                      "WARNING: GitHub API request failed."
                  )

                  print(
                      "Reason: "
                      + str(e)
                  )

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue


              # --------------------------------------------------------
              # GitHub API error
              # --------------------------------------------------------

              if response.status_code != 200:

                  print(
                      "WARNING: GitHub API request failed."
                  )

                  print(
                      "HTTP status: "
                      + str(
                          response.status_code
                      )
                  )


                  try:

                      error_data = (
                          response.json()
                      )

                      print(
                          "GitHub message: "
                          + str(
                              error_data.get(
                                  "message",
                                  "Unknown error"
                              )
                          )
                      )

                  except Exception:

                      pass


                  print(
                      "Skipping: "
                      + repo
                  )

                  continue


              # --------------------------------------------------------
              # Parse JSON
              # --------------------------------------------------------

              try:

                  release = response.json()


              except Exception as e:

                  print(
                      "WARNING: Invalid GitHub response."
                  )

                  print(
                      "Reason: "
                      + str(e)
                  )

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue


              # --------------------------------------------------------
              # Release information
              # --------------------------------------------------------

              tag_name = release.get(
                  "tag_name",
                  ""
              )


              release_name = (

                  release.get(
                      "name"
                  )

                  or tag_name

              )


              published_at = release.get(
                  "published_at",
                  ""
              )


              release_url = release.get(
                  "html_url",
                  ""
              )


              # --------------------------------------------------------
              # No release
              # --------------------------------------------------------

              if not tag_name:

                  print(
                      "WARNING: No release found."
                  )

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue


              # --------------------------------------------------------
              # Current release
              # --------------------------------------------------------

              print(
                  "Latest release : "
                  + tag_name
              )

              print(
                  "Release name   : "
                  + release_name
              )

              print(
                  "Published      : "
                  + published_at
              )


              # --------------------------------------------------------
              # Previous version
              # --------------------------------------------------------

              previous_version = state.get(
                  repo
              )


              # --------------------------------------------------------
              # First check
              # --------------------------------------------------------

              if previous_version is None:

                  print(
                      "Previous version: none"
                  )

                  print(
                      "First check for this repository."
                  )

                  print(
                      "Recording current version "
                      "without notification."
                  )


                  state[repo] = tag_name

                  state_changed = True

                  continue


              print(
                  "Previous version: "
                  + str(
                      previous_version
                  )
              )


              # --------------------------------------------------------
              # No new release
              # --------------------------------------------------------

              if previous_version == tag_name:

                  print(
                      "No new release."
                  )

                  print(
                      "Skipping notification."
                  )

                  continue


              # --------------------------------------------------------
              # New release detected
              # --------------------------------------------------------

              print("")
              print("****************************************")
              print("       NEW RELEASE DETECTED!")
              print("****************************************")


              print(
                  "Repository : "
                  + repo
              )

              print(
                  "Previous   : "
                  + str(
                      previous_version
                  )
              )

              print(
                  "Latest     : "
                  + tag_name
              )

              print(
                  "Name       : "
                  + release_name
              )

              print(
                  "Published  : "
                  + published_at
              )

              print(
                  "URL        : "
                  + release_url
              )

              print(
                  "****************************************"
              )


              # --------------------------------------------------------
              # Send notification
              # --------------------------------------------------------

              notification_sent = send_ntfy(

                  repo,

                  tag_name,

                  release_name,

                  published_at,

                  release_url

              )


              # --------------------------------------------------------
              # Notification success
              # --------------------------------------------------------

              if notification_sent:

                  print("")

                  print(
                      "Notification succeeded."
                  )

                  print(
                      "Updating stored version to "
                      + tag_name
                  )


                  state[repo] = tag_name

                  state_changed = True


              # --------------------------------------------------------
              # Notification failed
              # --------------------------------------------------------

              else:

                  print("")

                  print(
                      "Notification FAILED."
                  )

                  print(
                      "State will NOT be updated."
                  )

                  print(
                      "This release will be retried "
                      "on the next run."
                  )


              # --------------------------------------------------------
              # Small delay
              # --------------------------------------------------------

              time.sleep(1)


          # ============================================================
          # Save state.json
          # ============================================================

          if state_changed:

              print("")
              print("========================================")
              print(" Updating state.json")
              print("========================================")


              with open(

                  STATE_FILE,

                  "w",

                  encoding="utf-8"

              ) as f:

                  json.dump(

                      state,

                      f,

                      ensure_ascii=False,

                      indent=2

                  )

                  f.write("\n")


              print(
                  "state.json updated."
              )


          else:

              print("")

              print(
                  "No state changes."
              )


          # ============================================================
          # Finished
          # ============================================================

          print("")
          print("========================================")
          print(" Monitor finished")
          print("========================================")

          PY


      # ================================================================
      # Commit and push state.json
      # ================================================================

      - name: Commit and push state

        run: |

          set -e


          echo "========================================"
          echo " Saving monitor state"
          echo "========================================"


          # ------------------------------------------------------------
          # Git identity
          # ------------------------------------------------------------

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------------
          # Add state
          # ------------------------------------------------------------

          git add state.json


          # ------------------------------------------------------------
          # Nothing changed
          # ------------------------------------------------------------

          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi


          # ------------------------------------------------------------
          # Commit
          # ------------------------------------------------------------

          git commit \
            -m "Update release monitor state"


          # ------------------------------------------------------------
          # Fetch latest main
          # ------------------------------------------------------------

          echo "Fetching latest main..."

          git fetch origin main


          # ------------------------------------------------------------
          # Rebase
          # ------------------------------------------------------------

          echo "Rebasing..."

          git rebase origin/main


          # ------------------------------------------------------------
          # Push
          # ------------------------------------------------------------

          echo "Pushing..."

          git push origin HEAD:main


          echo "========================================"
          echo " State saved successfully"
          echo "========================================"

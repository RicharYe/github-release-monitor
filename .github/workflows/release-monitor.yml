name: GitHub Release Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " GitHub Release Monitor"
          echo "========================================"

          python <<'PY'
          import json
          import os
          import time
          import requests

          STATE_FILE = "state.json"

          # ========================================
          # 要监测的 GitHub 仓库
          # ========================================

          REPOSITORIES = [
              "clash-verge-rev/clash-verge-rev",
              "OpenListTeam/OpenList",
              "RaiDrive/RaiDrive",
              "happycola233/tchMaterial-parser",
          ]

          # ========================================
          # 环境变量
          # ========================================

          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")
          NTFY_URL = os.environ.get("NTFY_URL", "").strip()
          NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          # ========================================
          # 读取 state.json
          # ========================================

          try:
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  state = json.load(f)

              if not isinstance(state, dict):
                  state = {}

          except Exception:
              print("WARNING: state.json could not be read.")
              print("Starting with empty state.")
              state = {}

          # ========================================
          # GitHub Session
          # ========================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-release-monitor"
          })

          if GITHUB_TOKEN:
              session.headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"

          # ========================================
          # ntfy 通知函数
          # ========================================

          def send_ntfy(
              repo,
              version,
              release_name,
              published_at,
              release_url
          ):

              if not NTFY_URL:
                  print("ERROR: NTFY_URL is not configured.")
                  return False

              if not NTFY_TOPIC:
                  print("ERROR: NTFY_TOPIC is not configured.")
                  return False

              notify_url = (
                  NTFY_URL.rstrip("/")
                  + "/"
                  + NTFY_TOPIC
              )

              # ----------------------------------------
              # 正文使用 UTF-8，可以正常包含中文
              # ----------------------------------------

              message = (
                  f"仓库：{repo}\n"
                  f"版本：{version}\n"
                  f"名称：{release_name}\n"
                  f"发布时间：{published_at}\n"
                  f"Release：{release_url}"
              )

              # ----------------------------------------
              # HTTP Header 不使用中文
              #
              # requests 的 Header 对字符编码有限制，
              # 中文会导致 latin-1 codec 错误。
              # ----------------------------------------

              headers = {
                  "Title": "GitHub Release Update",
                  "Priority": "4",
                  "Tags": "github,new_release",
                  "Click": release_url,
              }

              print("")
              print("----------------------------------------")
              print("Sending ntfy notification")
              print("Repository : " + repo)
              print("Version    : " + version)
              print("----------------------------------------")

              try:

                  response = requests.post(
                      notify_url,
                      data=message.encode("utf-8"),
                      headers=headers,
                      timeout=30,
                  )

                  print(
                      "ntfy HTTP status: "
                      + str(response.status_code)
                  )

                  if 200 <= response.status_code < 300:

                      print(
                          "Notification sent successfully."
                      )

                      return True

                  print(
                      "ERROR: ntfy notification failed."
                  )

                  print(
                      "HTTP status: "
                      + str(response.status_code)
                  )

                  print(
                      "Response: "
                      + response.text
                  )

                  return False

              except Exception as e:

                  print(
                      "ERROR: ntfy request failed."
                  )

                  print(
                      "Reason: "
                      + str(e)
                  )

                  return False

          # ========================================
          # 状态是否发生变化
          # ========================================

          state_changed = False

          # ========================================
          # 开始检查所有仓库
          # ========================================

          for repo in REPOSITORIES:

              print("")
              print("----------------------------------------")
              print("Checking: " + repo)
              print("----------------------------------------")

              api_url = (
                  "https://api.github.com/repos/"
                  + repo
                  + "/releases/latest"
              )

              # ----------------------------------------
              # 请求 GitHub API
              # ----------------------------------------

              try:

                  response = session.get(
                      api_url,
                      timeout=30
                  )

              except Exception as e:

                  print(
                      "WARNING: GitHub API request failed"
                  )

                  print(
                      "Reason: "
                      + str(e)
                  )

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue

              # ----------------------------------------
              # GitHub API 错误
              # ----------------------------------------

              if response.status_code != 200:

                  print(
                      "WARNING: GitHub API request failed"
                  )

                  print(
                      "HTTP status: "
                      + str(response.status_code)
                  )

                  try:

                      error_data = response.json()

                      print(
                          "GitHub message: "
                          + str(
                              error_data.get(
                                  "message",
                                  "Unknown error"
                              )
                          )
                      )

                  except Exception:

                      pass

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue

              # ----------------------------------------
              # 解析 Release
              # ----------------------------------------

              try:

                  release = response.json()

              except Exception as e:

                  print(
                      "WARNING: Invalid GitHub response"
                  )

                  print(
                      "Reason: "
                      + str(e)
                  )

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue

              tag_name = release.get(
                  "tag_name",
                  ""
              )

              release_name = (
                  release.get("name")
                  or tag_name
              )

              published_at = release.get(
                  "published_at",
                  ""
              )

              release_url = release.get(
                  "html_url",
                  ""
              )

              # ----------------------------------------
              # 没有 Release
              # ----------------------------------------

              if not tag_name:

                  print(
                      "WARNING: No release found."
                  )

                  print(
                      "Skipping: "
                      + repo
                  )

                  continue

              # ----------------------------------------
              # 显示当前 Release
              # ----------------------------------------

              print(
                  "Latest release : "
                  + tag_name
              )

              print(
                  "Release name   : "
                  + release_name
              )

              print(
                  "Published      : "
                  + published_at
              )

              # ----------------------------------------
              # 获取历史版本
              # ----------------------------------------

              previous_version = state.get(repo)

              # ========================================
              # 第一次检测
              # ========================================

              if previous_version is None:

                  print(
                      "Previous version: none"
                  )

                  print(
                      "First check for this repository."
                  )

                  print(
                      "Recording current version "
                      "without notification."
                  )

                  state[repo] = tag_name
                  state_changed = True

                  continue

              # ========================================
              # 没有新版本
              # ========================================

              print(
                  "Previous version: "
                  + str(previous_version)
              )

              if previous_version == tag_name:

                  print(
                      "No new release."
                  )

                  print(
                      "Skipping notification."
                  )

                  continue

              # ========================================
              # 发现新版本
              # ========================================

              print("")
              print("****************************************")
              print(" NEW RELEASE DETECTED!")
              print("****************************************")

              print(
                  "Repository : "
                  + repo
              )

              print(
                  "Previous   : "
                  + str(previous_version)
              )

              print(
                  "Latest     : "
                  + tag_name
              )

              print(
                  "Name       : "
                  + release_name
              )

              print(
                  "Published  : "
                  + published_at
              )

              print(
                  "URL        : "
                  + release_url
              )

              print("****************************************")

              # ========================================
              # 发送 ntfy
              # ========================================

              notification_sent = send_ntfy(
                  repo,
                  tag_name,
                  release_name,
                  published_at,
                  release_url
              )

              # ========================================
              # 只有通知成功才更新 state
              # ========================================

              if notification_sent:

                  print("")
                  print(
                      "Notification succeeded."
                  )

                  print(
                      "Updating stored version to "
                      + tag_name
                  )

                  state[repo] = tag_name
                  state_changed = True

              else:

                  print("")
                  print(
                      "Notification FAILED."
                  )

                  print(
                      "State will NOT be updated."
                  )

                  print(
                      "This release will be retried "
                      "on the next run."
                  )

              # 防止连续请求过快
              time.sleep(1)

          # ========================================
          # 保存 state.json
          # ========================================

          if state_changed:

              print("")
              print("Updating state.json...")

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write("\n")

              print(
                  "state.json updated."
              )

          else:

              print("")
              print(
                  "No state changes."
              )

          PY

      # ========================================
      # 提交 state.json
      # ========================================

      - name: Commit and push state
        run: |

          set -e

          echo "========================================"
          echo " Saving monitor state"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          # ----------------------------------------
          # 没有变化就不提交
          # ----------------------------------------

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          # ----------------------------------------
          # 创建提交
          # ----------------------------------------

          git commit \
            -m "Update release monitor state"

          # ----------------------------------------
          # 获取远程最新 main
          # ----------------------------------------

          echo "Fetching latest main..."

          git fetch origin main

          # ----------------------------------------
          # Rebase
          # ----------------------------------------

          echo "Rebasing..."

          git rebase origin/main

          # ----------------------------------------
          # 推送
          # ----------------------------------------

          echo "Pushing..."

          git push origin HEAD:main

          echo "========================================"
          echo " State saved successfully"
          echo "========================================"
